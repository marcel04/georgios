[project]
name = "georgios-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.39.0",
]

[dependency-groups]
dev = [
    "fastapi-cli",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "ruff==0.16.6",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
